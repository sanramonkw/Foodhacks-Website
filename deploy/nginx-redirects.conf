# foodhacks.co — host-level redirect + error-page config
#
# Implements: DEPLOYMENT.md → pre-launch item 2, "301 redirects — full map,
# required at the host level". Kept in the repo so a server migration copies
# it rather than re-typing it from a document. Verified missing on the live
# host 2026-08-07 (/about/ and /products/ both returned 404).
#
# ###########################################################################
# CLOUDFLARE SITS IN FRONT OF THIS SITE (Server: cloudflare, verified
# 2026-08-07). Two valid places to implement the map:
#
#   (a) here at the origin, as nginx rules — the version-controlled option,
#       and the one that keeps all four sites consistent; or
#   (b) Cloudflare → Rules → Redirect Rules — fine, but the rules then live
#       only in the dashboard, which is the same "lost on migration" trap
#       that caused this problem. If you choose (b), still commit the rule
#       list here as documentation.
#
# EITHER WAY: the custom 404 page must be wired AT THE ORIGIN (Part B below).
# A bare nginx error page is currently passing straight through Cloudflare to
# visitors.
# ###########################################################################
#
# ###########################################################################
# CORRECTION TO DEPLOYMENT.md — the map's code block opens with the line:
#     /                    /en/                    301
# DO NOT IMPLEMENT IT. DEPLOYMENT.md's own "Caution" note directly beneath
# that block says so: `/` must keep serving the Arabic homepage directly.
# The line is in the block only as part of the old→new listing.
# ###########################################################################

# ---------------------------------------------------------------------------
# PART A — host canonicalisation
# ---------------------------------------------------------------------------
# With Cloudflare in front, do this in Cloudflare (SSL/TLS → Edge Certificates
# → "Always Use HTTPS" ON, plus a Redirect Rule for www → apex) rather than at
# the origin, since Cloudflare terminates TLS and the origin never sees the
# visitor's real scheme. Confirm afterwards that all of
#   http://foodhacks.co/ , http://www.foodhacks.co/ , https://www.foodhacks.co/
# 301 to https://foodhacks.co/ .

# ---------------------------------------------------------------------------
# PART B — inside the main server{} block at the origin
# ---------------------------------------------------------------------------

absolute_redirect off;

# Custom 404 — status stays 404; `internal` keeps /404.html unindexable.
# Purge the Cloudflare cache after adding this, or cached bare error pages
# will keep being served.
error_page 404 /404.html;
location = /404.html {
    internal;
}

# --- Old English-at-root URLs → /en/... ------------------------------------
# NB: no rule for "/" — see the correction notice above.
location = /about/                { return 301 /en/about/; }
location = /products/             { return 301 /en/products/; }
location = /faqs/                 { return 301 /en/faqs/; }
location = /contact/              { return 301 /en/contact/; }
location = /return-refund-policy/ { return 301 /en/return-refund-policy/; }

location = /about                { return 301 /en/about/; }
location = /products             { return 301 /en/products/; }
location = /faqs                 { return 301 /en/faqs/; }
location = /contact              { return 301 /en/contact/; }
location = /return-refund-policy { return 301 /en/return-refund-policy/; }

# The three English product pages.
location = /product/saffron-spray-200ml/ {
    return 301 /en/product/saffron-spray-200ml/;
}
location = /product/extra-virgin-olive-oil-spray-200ml/ {
    return 301 /en/product/extra-virgin-olive-oil-spray-200ml/;
}
location = /product/truffle-flavoured-extra-virgin-olive-oil-spray-125ml/ {
    return 301 /en/product/truffle-flavoured-extra-virgin-olive-oil-spray-125ml/;
}

# --- Old single-FAQ pages (no longer exist) --------------------------------
# Arabic first: nginx picks the LONGEST matching ^~ prefix, so /ar/faq/ wins
# over the generic /ar/ rule below regardless of the order in this file.
# Without this rule an Arabic FAQ URL would be stripped to /faq/<slug>/ and
# then land on the ENGLISH faqs page — wrong locale, and two hops.
location ^~ /ar/faq/ { return 301 /faqs-ar/; }
location ^~ /faq/    { return 301 /en/faqs/; }

# --- Old /ar/... (Polylang prefix) → AR-at-root ---------------------------
# Covers /ar/about-ar/, /ar/products-ar/, /ar/faqs-ar/, /ar/contact-ar/,
# /ar/return-refund-policy-ar/ and the three /ar/product/... URLs in one rule.
#
# NOTE: /ar/ currently returns 200 on the live site — that is Astro's own
# `redirects` config emitting a meta-refresh stub page at build time.
# DEPLOYMENT.md is explicit that these should be REAL 301s so search engines
# see a redirect rather than a meta-refresh. These rules take precedence over
# the stub file and give us that.
location = /ar  { return 301 /; }
location = /ar/ { return 301 /; }
location ^~ /ar/ {
    rewrite ^/ar/(.*)$ /$1 permanent;
}

# Old Arabic home slug — both the /ar/-prefixed and bare forms, each in a
# single hop. The exact-match `=` rules win over the `^~ /ar/` prefix above,
# so /ar/الرئيسية/ goes straight to / instead of chaining via /الرئيسية/.
location = /ar/الرئيسية/ { return 301 /; }
location = /الرئيسية/    { return 301 /; }
